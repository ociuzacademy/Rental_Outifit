{% extends 'user_index.html' %}
{% block content %}

<style>
.book-section {
    background: var(--warm-white);
    padding: 100px 0;
}

/* CARD */
.book-card {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 40px;
    border: 1px solid var(--bone);
    box-shadow: 0 25px 60px rgba(0,0,0,0.08);
}

/* TITLE */
.book-title {
    text-align: center;
    margin-bottom: 25px;
}

.book-title h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
}

.price {
    text-align: center;
    font-size: 18px;
    margin-bottom: 20px;
}

/* FORM */
.form-group {
    margin-bottom: 18px;
}

.form-group label {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 6px;
    color: var(--muted);
}

.form-control {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--bone);
    outline: none;
}

/* BUTTON */
.btn-book {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    border: none;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: 0.3s;
}

.btn-book:hover {
    background: var(--gold-light);
}

/* SIZE */
.size-select {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--bone);
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .book-card {
        padding: 25px;
    }
}
</style>

<div class="book-section">
    <div class="book-card">

        <div class="book-title">
            <h2>Book Outfit</h2>
            <p>{{ outfit.name }}</p>
        </div>

        <div class="price">
            ₹ {{ outfit.price }} / day
        </div>
        <p style="text-align:center; font-size:14px; margin-bottom:15px;">
    Selected Size: <strong>{{ request.GET.selected_size_id }}</strong>
</p>

<form method="POST">
    {% csrf_token %}

    <input type="hidden" name="selected_size_id" value="{{ request.GET.selected_size_id }}">

            <!-- NAME -->
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ user.name }}" required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control"
                       value="{{ user.email }}" required>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone_number" class="form-control"
                       value="{{ user.phone_number }}"
                       pattern="[0-9]{10,15}" required>
            </div>

            <!-- ADDRESS -->
            <div class="form-group">
                <label>Address</label>
                <textarea name="address" class="form-control"
                          placeholder="Enter delivery address">{{ user.address }}</textarea>
            </div>

            <!-- SIZE -->
           

            <!-- SUBMIT -->
            <button type="submit" class="btn-book">
                Continue to Payment
            </button>

        </form>

    </div>
</div>

{% endblock %}
